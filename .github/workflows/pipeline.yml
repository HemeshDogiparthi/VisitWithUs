name: Tourism Project Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch
  workflow_dispatch:  # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r VisitWithUs_project/deployment/requirements.txt
      - name: Add project to PYTHONPATH (so imports work) 
        run: echo "PYTHONPATH=$(pwd)/VisitWithUs_project" >> $GITHUB_ENV
      - name: Register Dataset
        run: python VisitWithUs_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: VisitWithUs_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r VisitWithUs_project/deployment/requirements.txt
      - name: Run Data Preparation
        run: python VisitWithUs_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            VisitWithUs_project/data/X_train.csv
            VisitWithUs_project/data/X_test.csv
            VisitWithUs_project/data/y_train.csv
            VisitWithUs_project/data/y_test.csv

  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                # get full history
          persist-credentials: true     # allow pushing using GITHUB_TOKEN

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r VisitWithUs_project/deployment/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: VisitWithUs_project/data

      - name: Run Model Training
        run: python VisitWithUs_project/model_building/train.py

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5

      # Option A (recommended): upload model as an artifact (no git commit)
      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: VisitWithUs_project/deployment/best_model.pkl
